name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Organiser les fichiers
        run: |
          M=app/src/main
          mkdir -p $M/java/com/brayan/videosplitter $M/res/values $M/res/drawable $M/res/mipmap-anydpi
          cp app-build.gradle.kts app/build.gradle.kts
          cp AndroidManifest.xml $M/AndroidManifest.xml
          cp MainActivity.kt VideoSplitter.kt SplitService.kt $M/java/com/brayan/videosplitter/
          cp colors.xml themes.xml $M/res/values/
          cp ic_launcher_background.xml ic_launcher_foreground.xml $M/res/drawable/
          cp ic_launcher.xml $M/res/mipmap-anydpi/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DecoupeurVideo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
